name: render-audio
on: [workflow_dispatch, push]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FluidSynth + soundfont + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth fluid-soundfont-gm ffmpeg
      - name: Render MIDI with FluidR3 samples
        run: |
          fluidsynth -ni -g 0.85 -r 44100 \
            -o synth.reverb.active=1 -o synth.reverb.room-size=0.6 -o synth.chorus.active=0 \
            /usr/share/sounds/sf2/FluidR3_GM.sf2 pocket.mid -F synth.wav
      - name: Master: arrangement arc + EQ + loudness (streaming filters)
        run: |
          ffmpeg -y -v error -i synth.wav -af "\
highpass=f=45,\
equalizer=f=250:width_type=q:w=1:g=-2.2,\
equalizer=f=700:width_type=q:w=1:g=0.5,\
equalizer=f=2500:width_type=q:w=1:g=2.2,\
equalizer=f=9000:width_type=q:w=1:g=1.2,\
volume=volume='if(lt(t,12.3),0.55,if(lt(t,15.5),0.55+0.25*min((t-12.3)/3.2,1),if(lt(t,25.0),0.8+0.2*min((t-15.5)/9.5,1),if(lt(t,47.0),1.0,if(lt(t,55.0),0.9,0.75)))))':eval=frame,\
afade=t=out:st=96:d=4.5,\
loudnorm=I=-14:TP=-2.0:LRA=11" -ar 44100 pocket_master.wav
          ffmpeg -y -v error -i pocket_master.wav -codec:a libmp3lame -b:a 256k pocket.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-render
          path: |
            pocket_master.wav
            pocket.mp3
